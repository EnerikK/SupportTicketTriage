server {
    listen 80;
    server_name _;

    # The browser only ever calls /api, so the UI and the API share an origin
    # and the API needs no CORS configuration at all. The trailing slash on
    # proxy_pass strips the /api prefix, so the API keeps serving /tickets
    # rather than having to know it is mounted under one.
    #
    # This is the container half of the same arrangement Vite's dev proxy
    # provides locally, which is what keeps the client code identical in both.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # /tickets/{id} is a client-side route, not a file on disk. Without
        # this fallback, opening or refreshing a ticket URL directly would
        # 404 at nginx before React ever ran - which is the whole point of
        # having real URLs.
        try_files $uri $uri/ /index.html;
    }
}
