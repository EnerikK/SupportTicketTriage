name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the real gate be fired by hand on a branch before merging something
  # that might move the numbers. That recovers most of what a per-PR real run
  # would give, at the few moments it actually matters.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/SupportTicketTriage.Client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/SupportTicketTriage.Client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Guards retrieval LOGIC, not retrieval quality.
  #
  # Runs offline against the lexical stand-in, so it needs no secrets and works
  # on forks. A broken resolved-only filter, model-stamp filter, self-exclusion,
  # k, or tie-break all move lexical recall, and those are code bugs that belong
  # in a pull request check. What it cannot see is a change in retrieval
  # quality, which comes from the embedding deployment or the redaction rules -
  # configuration, not code. The real gate below covers that.
  gate-retrieval-logic:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: eval
          POSTGRES_USER: postgres
          # No password, deliberately. This container lives for the length of
          # one job inside the runner's own network and is thrown away; the
          # alternative is a literal password in a connection string, which is
          # indistinguishable in shape from a real leaked credential and trips
          # secret scanning. A security check that is permanently red is one
          # people stop reading, which is the same failure this workflow's
          # gates are built to avoid.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # No AzureOpenAi__* variables, deliberately: their absence is what selects
      # the lexical stand-in, and the harness says so in its output.
      - name: Compare against the retrieval-logic baseline
        run: >-
          dotnet run --project tools/SupportTicketTriage.Eval --configuration Release --
          --connection "Host=localhost;Port=5432;Database=eval;Username=postgres"
          --reset
          --compare-baseline eval/baseline/lexical-logic-baseline.json

  # The real regression gate.
  #
  # On merge rather than per pull request: a full run is ~9 minutes of model
  # time and real money, and paying that on every push - including README
  # typos - is a tax people route around. It fires on main and on demand, and
  # names the merge that moved the numbers.
  #
  # Skipped on pull requests, which also means a fork PR gets a green CI rather
  # than a broken one, since forks never receive secrets.
  gate-evaluation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: eval
          POSTGRES_USER: postgres
          # No password, deliberately. This container lives for the length of
          # one job inside the runner's own network and is thrown away; the
          # alternative is a literal password in a connection string, which is
          # indistinguishable in shape from a real leaked credential and trips
          # secret scanning. A security check that is permanently red is one
          # people stop reading, which is the same failure this workflow's
          # gates are built to avoid.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Fails loudly rather than quietly falling back to the stand-in, which
      # would turn the real gate into a second copy of the logic gate while
      # still reporting success.
      #
      # The whitespace check is here because of a real failure: a secret
      # pasted into the web UI picked up a trailing newline, which is
      # invisible there, and the run died nine minutes and one paid embedding
      # call later with an HTTP 401. A malformed secret should cost a second,
      # not a run. Nothing about the values is printed - only which one is
      # wrong, and how.
      - name: Check the deployment configuration is usable
        env:
          ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          CHAT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          EMBEDDING: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
        run: |
          failed=0

          check() {
            name="$1"
            value="$2"

            if [ -z "$value" ]; then
              echo "::error::$name is not set. Without it this job would run against the lexical stand-in and compare quality numbers that mean nothing."
              failed=1
              return
            fi

            # printf %s rather than echo, so the comparison is not itself
            # confused by a trailing newline.
            trimmed=$(printf '%s' "$value" | tr -d '[:space:]')
            if [ "${#trimmed}" -ne "${#value}" ]; then
              echo "::error::$name contains whitespace. A trailing newline is invisible in the GitHub UI and produces an HTTP 401 at the first call. Re-set it with: printf '%s' \"\$VALUE\" | gh secret set $name"
              failed=1
            fi

            # Non-ASCII bytes, which is what a BOM looks like. Piping a value
            # to gh from PowerShell encodes it with the console encoding and
            # can prepend one; the key then arrives three bytes longer and the
            # HTTP client rejects the header outright with "Request headers
            # must contain only ASCII characters" - after four retries, a
            # minute, and a paid call. Set secrets from a shell that does not
            # re-encode: printf '%s' "$VALUE" | gh secret set NAME
            printable=$(printf '%s' "$value" | LC_ALL=C tr -d '[:print:]' | wc -c)
            if [ "$printable" -ne 0 ]; then
              echo "::error::$name contains $printable non-printable or non-ASCII byte(s), most likely a byte-order mark. Re-set it with: printf '%s' \"\$VALUE\" | gh secret set $name"
              failed=1
            fi
          }

          check AZURE_OPENAI_ENDPOINT "$ENDPOINT"
          check AZURE_OPENAI_API_KEY "$API_KEY"
          check AZURE_OPENAI_CHAT_DEPLOYMENT "$CHAT"
          check AZURE_OPENAI_EMBEDDING_DEPLOYMENT "$EMBEDDING"

          case "$ENDPOINT" in
            https://*) ;;
            *) echo "::error::AZURE_OPENAI_ENDPOINT does not start with https://."; failed=1 ;;
          esac

          # The portal shows the key and the endpoint adjacent, both masked
          # behind the same kind of control, and one has been pasted into the
          # other's field. A key is never a URL.
          case "$API_KEY" in
            http://*|https://*)
              echo "::error::AZURE_OPENAI_API_KEY is a URL. The endpoint has probably been pasted into the key field - the portal shows them next to each other. The key has no scheme and no dots."
              failed=1 ;;
          esac

          exit $failed

      - name: Compare against the evaluation baseline
        env:
          AzureOpenAi__Endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AzureOpenAi__ApiKey: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AzureOpenAi__ChatDeployment: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          AzureOpenAi__EmbeddingDeployment: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
        run: >-
          dotnet run --project tools/SupportTicketTriage.Eval --configuration Release --
          --connection "Host=localhost;Port=5432;Database=eval;Username=postgres"
          --reset
          --compare-baseline

      # Kept whatever the gate decided, because the run that failed is the one
      # worth reading.
      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: eval/results/
          if-no-files-found: warn
